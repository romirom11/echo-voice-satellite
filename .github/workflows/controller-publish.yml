# Publish the controller image to GHCR.
#
# The controller is versioned by `controller-v*` tags (see controller/version.py):
# the tag's annotation is the release note the dashboard shows, and the image is
# tagged with the version so a deployment pins it:
#
#   git tag -a controller-v2.21.0 -m "release notes…"
#   git push origin controller-v2.21.0
#
# Every push to main also publishes a `sha-<short>` image and moves `latest`,
# so `docker compose pull` on a deployment that tracks `latest` picks it up.
name: Controller Publish

on:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - '.github/workflows/controller-publish.yml'
    tags: ['controller-v*']
  workflow_dispatch:

# A tag push and the main push it sits on trigger two builds of the same
# commit. Their images are byte-identical, and pushing the same layers to
# GHCR from two runners at once has failed with "error writing layer blob:
# not_found" (controller-v2.21.1). Serialise them instead.
concurrency:
  group: controller-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push controller image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version and image tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/echomuse-controller"
          sha="$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/controller-v* ]]; then
            version="${GITHUB_REF_NAME#controller-}"        # controller-v2.21.0 -> v2.21.0
            tags="${image}:${version},${image}:latest,${image}:sha-${sha}"
          else
            version="sha-${sha}"
            tags="${image}:sha-${sha},${image}:latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: controller
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            EM_CONTROLLER_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
